  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- Start screen ---------- */
  .panel {
    background: rgba(28,46,40,0.82);
    backdrop-filter: blur(1px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 26px 22px;
  }

  .title-row {
    text-align: center;
    margin-bottom: 4px;
  }

  .hero-img {
    display: block;
    width: 120px;
    height: auto;
    margin: 0 auto 6px;
  }

  .mascot-img {
    display: block;
    width: 130px;
    height: auto;
    margin: 0 auto 4px;
  }

  .title-row h1 {
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
    font-weight: 900;
  }

  .title-row p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .rules {
    margin: 20px 0;
    font-size: 14px;
    line-height: 1.9;
    color: #d7d2c0;
  }

  .rules b { color: var(--gold); font-weight: 700; }

  .mode-select {
    display: flex;
    gap: 8px;
    margin: 16px 0 6px;
  }

  .mode-btn {
    flex: 1;
    padding: 12px 6px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: transparent;
    color: var(--paper);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }

  .mode-btn.active {
    border-color: var(--accent-bright);
    background: rgba(63,140,124,0.18);
  }

  .mode-hint {
    font-size: 12px;
    color: var(--muted);
    min-height: 32px;
    line-height: 1.5;
  }

  .primary-btn {
    width: 100%;
    padding: 15px;
    margin-top: 14px;
    border: none;
    border-radius: 14px;
    background: var(--accent-bright);
    color: #0d1a16;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
    cursor: pointer;
  }

  .primary-btn:active { transform: scale(0.98); }

  /* ---------- Game HUD ---------- */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
    font-size: 13px;
  }

  .hud .score b {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--gold);
    display: block;
  }

  .hud .lives {
    font-size: 18px;
    letter-spacing: 3px;
  }

  .hud .streak {
    text-align: right;
    color: var(--muted);
  }
  .hud .streak b {
    font-family: 'JetBrains Mono', monospace;
    color: var(--paper);
    font-size: 15px;
  }

  /* ---------- Card ---------- */
  .stage {
    background: rgba(28,46,40,0.82);
    backdrop-filter: blur(1px);
    border-radius: 20px;
    padding: 26px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .card {
    width: 200px;

    border-radius: 16px;
    border: 1px solid var(--paper-edge);
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: transform .08s ease;
  }
  .card:active { transform: scale(0.97); }

  .card .z {
    position: absolute;
    top: 12px;
    left: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--muted);
  }

  .card .symbol {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 54px;
    line-height: 1;
  }

  .card .name {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .card .fact {
    margin-top: 8px;
    font-size: 10.5px;
    line-height: 1.35;
    color: var(--muted);
    padding: 0 12px;
    font-weight: 500;
  }

  .card .fam-dot {
    position: absolute;
    bottom: 12px;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity .15s;
  }

  .card.reveal .fam-dot { opacity: 1; }

  .card.flash-correct { animation: flashGood .32s ease; }
  .card.flash-wrong { animation: flashBad .32s ease; }

  @keyframes flashGood {
    0% { box-shadow: 0 0 0 0 rgba(63,140,124,0.9); }
    100% { box-shadow: 0 0 0 14px rgba(63,140,124,0); }
  }
  @keyframes flashBad {
    0% { box-shadow: 0 0 0 0 rgba(181,83,60,0.9); }
    100% { box-shadow: 0 0 0 14px rgba(181,83,60,0); }
  }

  .tap-hint {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }

  .feedback {
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity .2s;
  }
  .feedback.show { opacity: 1; }
  .feedback.good { background: rgba(63,140,124,0.25); color: #8fd6c4; }
  .feedback.bad { background: rgba(181,83,60,0.25); color: #f0b09f; }

  /* ---------- Legend ---------- */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    justify-content: center;
    padding: 12px 6px 2px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i {
    width: 16px; height: 16px; border-radius: 4px; display: inline-block;

  /* ---------- Game over ---------- */
  .final-score {
    text-align: center;
    margin: 6px 0 2px;
  }
  .final-score .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 52px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }
  .final-score .label {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }

  .mute-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(28,46,40,0.85);
    color: var(--paper);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .mute-btn:active { transform: scale(0.94); }

  .hidden { display: none !important; }
</style>

<script>
/* ---------- Audio engine (Web Audio API, no external files) ---------- */
let audioCtx = null;
let muted = false;

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep({freq = 440, duration = 0.12, type = 'sine', gain = 0.22, delay = 0, slideTo = null}) {
  if (muted) return;
  const ctx = getCtx();
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

/* short filtered noise burst — used for the "slap" / percussive hit feel */
function noiseBurst({duration = 0.05, gain = 0.25, delay = 0, filterType = 'highpass', filterFreq = 2500}) {
  if (muted) return;
  const ctx = getCtx();
  const t0 = ctx.currentTime + delay;
  const size = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = filterFreq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  src.connect(filter);
  filter.connect(g);
  g.connect(ctx.destination);
  src.start(t0);
  src.stop(t0 + duration + 0.01);
}

function playTick() {
  beep({freq: 320, duration: 0.035, type: 'square', gain: 0.05});
}
function playCorrect(streakNow) {
  // percussive "slap" hit, then a bright rising chime that climbs with streak
  noiseBurst({duration: 0.035, gain: 0.3, filterType: 'highpass', filterFreq: 3000});
  const base = 640 + Math.min(streakNow, 12) * 16;
  beep({freq: base, duration: 0.08, type: 'triangle', gain: 0.2, delay: 0.015});
  beep({freq: base * 1.5, duration: 0.14, type: 'triangle', gain: 0.15, delay: 0.075});
}
function playWrong() {
  // dull mis-slap thud + harsh buzz
  noiseBurst({duration: 0.06, gain: 0.22, filterType: 'lowpass', filterFreq: 900});
  beep({freq: 220, duration: 0.2, type: 'sawtooth', gain: 0.18, slideTo: 105, delay: 0.02});
}
function playMiss() {
  beep({freq: 180, duration: 0.22, type: 'square', gain: 0.16, slideTo: 90});
}
function playStart() {
  beep({freq: 440, duration: 0.08, type: 'square', gain: 0.14});
  beep({freq: 660, duration: 0.12, type: 'square', gain: 0.14, delay: 0.09});
}
function playGameOver() {
  [523, 466, 392, 330].forEach((f, i) =>
    beep({freq: f, duration: 0.22, type: 'triangle', gain: 0.18, delay: i * 0.16})
  );
}

/* ---------- Heartbeat background pulse — speeds up as lives run out ---------- */
let heartbeatTimer = null;
let heartbeatMs = 620;

function playHeartbeatPulse() {
  beep({freq: 92, duration: 0.11, type: 'sine', gain: 0.12});
  beep({freq: 70, duration: 0.13, type: 'sine', gain: 0.09, delay: 0.15});
}
function startHeartbeat() {
  stopHeartbeat();
  heartbeatTimer = setInterval(playHeartbeatPulse, heartbeatMs);
}
function stopHeartbeat() {
  if (heartbeatTimer) {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }
}
function setHeartbeatTempo(livesLeft) {
  // fewer lives = faster, more anxious heartbeat
  heartbeatMs = livesLeft >= 3 ? 620 : livesLeft === 2 ? 480 : 360;
  if (heartbeatTimer) startHeartbeat();
}

let mode = 'family';

let curCard = null;

let streak = 0;
let bestStreak = 0;
let lives = 3;
let awaitingTap = false;
let matchIsCorrect = false;
let advanceTimer = null;

const startScreen = document.getElementById('startScreen');

    document.getElementById('modeHint').textContent = HINTS[mode];

  });
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  deck = shuffle(ELEMENTS);
  pos = 0;
  prevCard = null;
  score = 0;
  streak = 0;
  bestStreak = 0;
  lives = 3;
  updateHud();
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  playStart();
  setHeartbeatTempo(lives);
  startHeartbeat();
  nextCard();
}

function isMatch(a, b) {
  if (!a || !b) return false;
  if (mode === 'family') {
    // 氫（H）化學性質與鹼金屬不同，不能算進同一族比對
    if (a.sym === 'H' || b.sym === 'H') return false;
    return a.fam === b.fam;
  }
  return a.metal === b.metal;
}

function nextCard() {
  if (pos >= deck.length) {
    deck = deck.concat(shuffle(ELEMENTS));
  }
  prevCard = curCard;
  curCard = deck[pos++];
  renderCard(curCard);
  matchIsCorrect = isMatch(prevCard, curCard);
  awaitingTap = true;
  playTick();

  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => {
    if (awaitingTap && matchIsCorrect) {
      awaitingTap = false;
      cardEl.classList.add('reveal');
      playMiss();
      loseLife('漏拍!');
    } else {
      awaitingTap = false;
      nextCard();
    }
  }, ADVANCE_MS);
}

function renderCard(c) {
  cardZ.textContent = c.z;
  cardSymbol.textContent = c.sym;
  cardName.textContent = c.name;
  cardFact.textContent = FACTS[c.sym] || '';
  // 氫不屬於任何一族，翻牌時不顯示族群圖示，避免暗示它是鹼金屬
  cardDot.className = c.sym === 'H' ? 'fam-dot' : 'fam-dot icn-' + c.fam;
  cardEl.classList.remove('reveal', 'flash-correct', 'flash-wrong');
}

cardEl.addEventListener('click', handleTap);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !gameScreen.classList.contains('hidden')) {
    e.preventDefault();
    handleTap();
  }
});

function handleTap() {
  if (!awaitingTap) return;
  awaitingTap = false;
  clearTimeout(advanceTimer);
  cardEl.classList.add('reveal');

  if (matchIsCorrect) {
    score += 10 + streak * 2;
    streak += 1;
    bestStreak = Math.max(bestStreak, streak);
    showFeedback('正確 +' + (10 + (streak - 1) * 2), true);
    cardEl.classList.add('flash-correct');
    playCorrect(streak);
    updateHud();
    setTimeout(nextCard, 550);
  } else {
    showFeedback('拍錯了', false);
    cardEl.classList.add('flash-wrong');
    playWrong();
    loseLife();
  }
}

function loseLife(customMsg) {
  streak = 0;
  lives -= 1;
  updateHud();
  setHeartbeatTempo(Math.max(lives, 0));
  if (customMsg) showFeedback(customMsg, false);
  if (lives <= 0) {
    setTimeout(endGame, 500);
  } else {
    setTimeout(nextCard, 650);
  }
}

function showFeedback(text, good) {
  feedback.textContent = text;
  feedback.className = 'feedback show ' + (good ? 'good' : 'bad');
  setTimeout(() => feedback.classList.remove('show'), 700);
}

function updateHud() {
  scoreVal.textContent = score;
  streakVal.textContent = streak;
  livesVal.textContent = '♥ '.repeat(Math.max(lives, 0)).trim() + ' ' + '♡ '.repeat(3 - Math.max(lives, 0)).trim();
}

function endGame() {
  gameScreen.classList.add('hidden');
  overScreen.classList.remove('hidden');
  stopHeartbeat();
  playGameOver();
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalStreak').textContent = bestStreak;
}
